name: Mobile Android Build

on:
  pull_request:
    branches:
      - main
    paths:
      - "CombatLR.mobile/**"
      - ".github/workflows/mobile-android-build.yml"
      - ".github/workflows/mobile-android-release.yml"
  push:
    branches:
      - main
      - mobile-android-release-build
    paths:
      - "CombatLR.mobile/**"
      - ".github/workflows/mobile-android-build.yml"
      - ".github/workflows/mobile-android-release.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build CombatLR Mobile for Android
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install .NET MAUI Android workload
        run: dotnet workload install maui-android

      - name: Build Android application
        run: dotnet build CombatLR.mobile/CombatLR.mobile.csproj --configuration Release --framework net10.0-android
