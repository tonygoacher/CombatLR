name: ESP32 Firmware Release

on:
  push:
    tags:
      - "firmware-v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish ESP32-S3 firmware
    runs-on: ubuntu-latest

    steps:
      - name: Check out source and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Extract and validate firmware version
        id: version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#firmware-v}"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag '$TAG' is not a valid firmware version tag (expected firmware-vX.Y.Z)."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building CombatLR firmware $VERSION"

      - name: Compile firmware
        working-directory: Firmware
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: pio run -e esp32s3_n16r8

      - name: Prepare release assets
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          BUILD_DIR="Firmware/.pio/build/esp32s3_n16r8"
          PACKAGE_DIR="release-package"
          mkdir -p "$PACKAGE_DIR"

          test -f "$BUILD_DIR/firmware.bin"
          test -f "$BUILD_DIR/bootloader.bin"
          test -f "$BUILD_DIR/partitions.bin"

          cp "$BUILD_DIR/firmware.bin" "$PACKAGE_DIR/CombatLR-Firmware-v$VERSION.bin"
          cp "$BUILD_DIR/bootloader.bin" "$PACKAGE_DIR/"
          cp "$BUILD_DIR/partitions.bin" "$PACKAGE_DIR/"

          if [ -f "$BUILD_DIR/boot_app0.bin" ]; then
            cp "$BUILD_DIR/boot_app0.bin" "$PACKAGE_DIR/"
          fi

          cat > "$PACKAGE_DIR/README.txt" <<EOF
          CombatLR ESP32-S3 Firmware v$VERSION

          OTA update:
            Use CombatLR-Firmware-v$VERSION.bin as the application image.

          Full flash:
            This package contains the firmware, bootloader and partition table
            generated by the same PlatformIO build. Flash them using the offsets
            appropriate for the ESP32-S3 board and partition configuration:
              bootloader.bin  -> 0x0000
              partitions.bin  -> 0x8000
              firmware image  -> 0x10000

          Build target: esp32s3_n16r8
          EOF

          cd "$PACKAGE_DIR"
          zip -r "../CombatLR-Firmware-v$VERSION-flash.zip" .
          cd ..
          cp "$BUILD_DIR/firmware.bin" "CombatLR-Firmware-v$VERSION.bin"

      - name: Find previous firmware tag
        id: previous
        shell: bash
        run: |
          PREVIOUS_TAG="$(git describe --tags --abbrev=0 --match 'firmware-v*' "${GITHUB_SHA}^" 2>/dev/null || true)"
          echo "tag=$PREVIOUS_TAG" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          PREVIOUS_TAG: ${{ steps.previous.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          ASSETS=(
            "CombatLR-Firmware-v$VERSION.bin"
            "CombatLR-Firmware-v$VERSION-flash.zip"
          )

          if [ -n "$PREVIOUS_TAG" ]; then
            gh release create "$TAG" "${ASSETS[@]}" \
              --title "CombatLR Firmware v$VERSION" \
              --generate-notes \
              --notes-start-tag "$PREVIOUS_TAG"
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --title "CombatLR Firmware v$VERSION" \
              --generate-notes
          fi
