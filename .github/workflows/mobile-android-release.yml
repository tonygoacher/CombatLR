name: Mobile Android Release

on:
  push:
    tags:
      - "mobile-v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing mobile release tag to build (for example mobile-v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish CombatLR Mobile for Android
    runs-on: windows-latest
    steps:
      - name: Check out source and tags
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0

      - name: Validate signing secrets
        shell: pwsh
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          foreach ($name in @("STORE_PASSWORD", "KEY_PASSWORD")) {
            $value = [Environment]::GetEnvironmentVariable($name)
            if ([string]::IsNullOrEmpty($value)) {
              throw "$name is empty"
            }
            $nonAscii = $value.ToCharArray() | Where-Object { [int]$_ -gt 127 }
            Write-Host "$name length: $($value.Length)"
            Write-Host "$name contains non-ASCII: $([bool]$nonAscii)"
          }
          Write-Host "Passwords identical: $($env:STORE_PASSWORD -ceq $env:KEY_PASSWORD)"

      - name: Prepare Android signing key
        shell: pwsh
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ANDROID_KEYSTORE_BASE64)) {
            throw "Configure ANDROID_KEYSTORE_BASE64 before creating a mobile release."
          }

          $keystore = Join-Path $env:RUNNER_TEMP "combatlr-release.keystore"
          [IO.File]::WriteAllBytes(
            $keystore,
            [Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64)
          )

          if (-not (Test-Path $keystore)) {
            throw "Keystore was not created"
          }

          "ANDROID_KEYSTORE_PATH=$keystore" >> $env:GITHUB_ENV
          Write-Host "Keystore created successfully"
          $hash = (Get-FileHash $keystore -Algorithm SHA256).Hash
          Write-Host "Decoded keystore SHA256: $hash"

      - name: Verify decoded keystore
        shell: pwsh
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          Write-Host "Keystore path: $env:ANDROID_KEYSTORE_PATH"
          if (-not (Test-Path $env:ANDROID_KEYSTORE_PATH)) {
            throw "Keystore file not found"
          }

          keytool -list -keystore "$env:ANDROID_KEYSTORE_PATH" -storepass "$env:STORE_PASSWORD"
          if ($LASTEXITCODE -ne 0) {
            throw "Keystore validation failed"
          }

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install .NET MAUI Android workload
        run: dotnet workload install maui-android

      - name: Extract and validate version
        id: version
        shell: pwsh
        run: |
          $tag = "${{ inputs.release_tag || github.ref_name }}"
          if ($tag -notmatch '^mobile-v(\d+)\.(\d+)\.(\d+)$') {
            throw "Invalid mobile tag '$tag'. Expected mobile-vX.Y.Z."
          }

          $version = "$($Matches[1]).$($Matches[2]).$($Matches[3])"
          $major = [int64]$Matches[1]
          $minor = [int64]$Matches[2]
          $patch = [int64]$Matches[3]
          if ($minor -gt 999 -or $patch -gt 999) {
            throw "Mobile version minor and patch components must be 999 or less."
          }

          $versionCode = ($major * 1000000) + ($minor * 1000) + $patch
          if ($versionCode -gt 2100000000) {
            throw "Calculated Android version code exceeds the supported maximum."
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "version_code=$versionCode" >> $env:GITHUB_OUTPUT

      - name: Publish signed Android APK
        shell: pwsh
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ANDROID_KEY_ALIAS) -or
              [string]::IsNullOrWhiteSpace($env:ANDROID_KEY_PASSWORD) -or
              [string]::IsNullOrWhiteSpace($env:ANDROID_STORE_PASSWORD)) {
            throw "Configure ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD and ANDROID_STORE_PASSWORD repository secrets."
          }

          dotnet publish CombatLR.mobile/CombatLR.mobile.csproj `
            --configuration Release `
            --framework net10.0-android `
            -p:AndroidPackageFormat=apk `
            -p:AndroidKeyStore=true `
            -p:AndroidSigningKeyStore="$env:ANDROID_KEYSTORE_PATH" `
            -p:AndroidSigningKeyAlias="$env:ANDROID_KEY_ALIAS" `
            -p:AndroidSigningKeyPass="$env:ANDROID_KEY_PASSWORD" `
            -p:AndroidSigningStorePass="$env:ANDROID_STORE_PASSWORD" `
            -p:ApplicationDisplayVersion=${{ steps.version.outputs.version }} `
            -p:ApplicationVersion=${{ steps.version.outputs.version_code }} `
            -p:Version=${{ steps.version.outputs.version }} `
            --verbosity minimal `
            --output publish/android

          if ($LASTEXITCODE -ne 0) {
            throw "Android APK publish failed with exit code $LASTEXITCODE"
          }

      - name: Publish signed Android App Bundle
        shell: pwsh
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          dotnet publish CombatLR.mobile/CombatLR.mobile.csproj `
            --configuration Release `
            --framework net10.0-android `
            -p:AndroidPackageFormat=aab `
            -p:AndroidKeyStore=true `
            -p:AndroidSigningKeyStore="$env:ANDROID_KEYSTORE_PATH" `
            -p:AndroidSigningKeyAlias="$env:ANDROID_KEY_ALIAS" `
            -p:AndroidSigningKeyPass="$env:ANDROID_KEY_PASSWORD" `
            -p:AndroidSigningStorePass="$env:ANDROID_STORE_PASSWORD" `
            -p:ApplicationDisplayVersion=${{ steps.version.outputs.version }} `
            -p:ApplicationVersion=${{ steps.version.outputs.version_code }} `
            -p:Version=${{ steps.version.outputs.version }} `
            --verbosity minimal `
            --output publish/android-aab

          if ($LASTEXITCODE -ne 0) {
            throw "Android App Bundle publish failed with exit code $LASTEXITCODE"
          }

      - name: Upload diagnostic Android packages
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: CombatLR-Mobile-${{ steps.version.outputs.version }}-diagnostic
          path: |
            publish/android/*.apk
            publish/android-aab/*.aab
          if-no-files-found: error
          retention-days: 7

      - name: Generate SHA-256 checksums
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $apkFiles = @(Get-ChildItem publish/android -Filter "*-Signed.apk" -File)
          $aabFiles = @(Get-ChildItem publish/android-aab -Filter "*-Signed.aab" -File)
          if ($apkFiles.Count -ne 1) { throw "Expected exactly one signed APK, found $($apkFiles.Count)." }
          if ($aabFiles.Count -ne 1) { throw "Expected exactly one signed Android App Bundle, found $($aabFiles.Count)." }
          $apk = $apkFiles[0]
          $aab = $aabFiles[0]

          $apkHash = Get-FileHash $apk.FullName -Algorithm SHA256
          "$($apkHash.Hash.ToLower())  $($apk.Name)" | Set-Content "$($apk.FullName).sha256"
          $aabHash = Get-FileHash $aab.FullName -Algorithm SHA256
          "$($aabHash.Hash.ToLower())  $($aab.Name)" | Set-Content "$($aab.FullName).sha256"

      - name: Find previous mobile release tag
        if: github.event_name == 'push'
        id: previous
        shell: pwsh
        run: |
          $currentTag = "${{ github.ref_name }}"
          $tags = @(git tag --list "mobile-v*" --sort=-version:refname)

          if ($LASTEXITCODE -ne 0) {
            throw "Unable to list mobile release tags."
          }

          $previous = $tags |
            Where-Object { $_ -ne $currentTag } |
            Select-Object -First 1

          Write-Host "Current tag: $currentTag"
          Write-Host "Previous tag: $previous"
          "tag=$previous" >> $env:GITHUB_OUTPUT

      - name: Publish GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = "${{ steps.version.outputs.version }}"
          $apkFiles = @(Get-ChildItem publish/android -Filter "*-Signed.apk" -File)
          $apkChecksumFiles = @(Get-ChildItem publish/android -Filter "*-Signed.apk.sha256" -File)
          $aabFiles = @(Get-ChildItem publish/android-aab -Filter "*-Signed.aab" -File)
          $aabChecksumFiles = @(Get-ChildItem publish/android-aab -Filter "*-Signed.aab.sha256" -File)

          if ($apkFiles.Count -ne 1) { throw "Expected exactly one APK, found $($apkFiles.Count)." }
          if ($apkChecksumFiles.Count -ne 1) { throw "Expected exactly one APK checksum, found $($apkChecksumFiles.Count)." }
          if ($aabFiles.Count -ne 1) { throw "Expected exactly one AAB, found $($aabFiles.Count)." }
          if ($aabChecksumFiles.Count -ne 1) { throw "Expected exactly one AAB checksum, found $($aabChecksumFiles.Count)." }

          $assets = @(
            $apkFiles[0].FullName,
            $apkChecksumFiles[0].FullName,
            $aabFiles[0].FullName,
            $aabChecksumFiles[0].FullName
          )

          if ("${{ steps.previous.outputs.tag }}") {
            gh release create $tag @assets --title "CombatLR Mobile v$version" --generate-notes --notes-start-tag "${{ steps.previous.outputs.tag }}"
          } else {
            gh release create $tag @assets --title "CombatLR Mobile v$version" --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { throw "GitHub release creation failed." }
